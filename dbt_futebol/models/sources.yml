version: 2

sources:
  - name: raw
    database: "{{ target.database }}"
    schema: raw
    tables:
      - name: matches
        description: Partidas brutas extraidas da football-data.org ou do sample local.
        columns:
          - name: source
            description: Origem do dado.
            tests:
              - not_null
          - name: match_id
            description: Identificador da partida na fonte.
            tests:
              - not_null
          - name: payload
            description: JSON bruto da partida.
            tests:
              - not_null

      - name: observations
        description: Observações preservadas por coleta.
  - name: ops
    database: "{{ target.database }}"
    schema: ops
    tables:
      - name: runs
        description: Execuções de ingestão e seus horários.
