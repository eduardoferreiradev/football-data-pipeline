version: 2

models:
  - name: match_results
    description: Resultado final de cada partida finalizada.
    columns:
      - name: source
        tests:
          - not_null
      - name: match_id
        tests:
          - not_null
          - unique
      - name: home_team_name
        tests:
          - not_null
      - name: away_team_name
        tests:
          - not_null

  - name: team_performance
    description: Tabela analitica com desempenho agregado por time.
    columns:
      - name: team_id
        tests:
          - not_null
          - unique
      - name: team_name
        tests:
          - not_null
      - name: points
        tests:
          - not_null

  - name: home_away_performance
    description: Desempenho dos times separado por mandante e visitante.
    columns:
      - name: team_id
        tests:
          - not_null
      - name: team_name
        tests:
          - not_null
      - name: venue
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['home', 'away']
      - name: points
        tests:
          - not_null

  - name: round_summary
    description: Resumo de gols e resultados por rodada.
    columns:
      - name: competition_code
        tests:
          - not_null
      - name: season_year
        tests:
          - not_null
      - name: matchday
        tests:
          - not_null
          - unique
      - name: total_goals
        tests:
          - not_null

  - name: team_attack_defense
    description: Ranking de ataque e defesa por time.
    columns:
      - name: team_id
        tests:
          - not_null
          - unique
      - name: team_name
        tests:
          - not_null
      - name: attack_rank
        tests:
          - not_null
      - name: defense_rank
        tests:
          - not_null
